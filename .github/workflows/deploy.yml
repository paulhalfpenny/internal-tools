name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            umask 0002
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            cd /var/www/internal.filter.agency
            git pull origin main
            composer install --no-dev --no-interaction --optimize-autoloader
            npm ci && npm run build
            php artisan migrate --force
            php artisan view:clear
            mkdir -p storage/framework/views bootstrap/cache
            chgrp -R www-data storage/framework/views bootstrap/cache
            chmod -R ug+rwX storage/framework/views bootstrap/cache
            find storage/framework/views -type f -name '*.php' -delete
            find storage/framework/views bootstrap/cache -type d -exec chmod g+s {} +
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            chgrp -R www-data storage/framework/views bootstrap/cache
            chmod -R ug+rwX storage/framework/views bootstrap/cache
            find storage/framework/views bootstrap/cache -type d -exec chmod g+s {} +
            php artisan queue:restart
